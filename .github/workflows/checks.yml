name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  behaviour:
    runs-on: ubuntu-24.04   # фіксовано: ubuntu-latest з 19.10.2026 → Ubuntu 26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test            # WayForPay → Meta: api/wayforpay.mjs
      - run: pnpm exec playwright install --with-deps chromium
      - run: python3 -m http.server 8080 --directory site &
      - run: sleep 1 && node handoff/checks/behaviour.js http://localhost:8080/
